<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>起雾的窗户</title>
<meta name="description" content="下雨天的一扇窗，用手指擦掉雾气，看看窗外。">
<meta name="theme-color" content="#0d121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="起雾的窗户">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="glass" aria-label="起雾的窗户，用手指擦掉雾气"></canvas>

<div class="hud" id="hud">
  <button class="where" id="where" type="button" aria-label="换一条街"><span id="whereText">雨夜</span><span class="where-ico" aria-hidden="true">↻</span></button>
</div>

<nav class="bar" id="bar" aria-label="工具">
  <button type="button" data-panel="view"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M12 3.5v17M3.5 12h17"/></svg>窗外</button>
  <button type="button" data-panel="brush"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20c-2.5 0-4-1.6-4-3.6 0-2.2 2-3 3.2-4.6C8.8 9.7 9 6 10.5 4c.8 2.6.4 5 .2 6.6 1.4-1.4 2.1-3.4 2.3-5.6 2.3 2 4 5.4 4 8.6 0 3.6-2.6 6.4-6 6.4z"/></svg><span id="brushLabel">指尖</span></button>
  <button type="button" data-panel="rain"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 13.5h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 13.5z"/><path d="M8 16.5l-1 3M12 16.5l-1 3M16 16.5l-1 3"/></svg>雨</button>
  <button type="button" data-panel="fog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h13M7 12.5h13M4 16h12M8 19.5h9"/><path d="M6 6c1.5-2 4-2.5 6-2.5"/></svg>雾</button>
  <button type="button" id="saveBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/></svg>存图</button>
</nav>

<div class="panel-wrap" id="panelWrap" hidden>
  <div class="panel-back" id="panelBack"></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true"></section>
</div>

<div class="save" id="save" hidden>
  <div class="save-inner">
    <img id="saveImg" alt="这扇窗现在的样子">
    <p>长按图片，选择「存储到照片」</p>
    <div class="save-actions">
      <a class="btn" id="saveDl" download="foggy-window.jpg">下载图片</a>
      <button type="button" class="btn ghost" id="saveClose">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script src="js/scenes.js"></script>
<script src="js/glass.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
